name: Phase 1 - Pre-Merge DevSecOps CI Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  frontend-quality-and-tests:
    name: React Unit Tests, Dependency Audit & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Frontend Unit & Integration Tests
        run: npm test

      - name: Dependency Vulnerability Audit (Production High/Critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Verify Production Static Bundle Build
        run: npm run build

  shift-left-security-and-iac:
    name: Hadolint, Trivy Container/IaC Scan & Terraform Validation
    runs-on: ubuntu-latest
    needs: frontend-quality-and-tests
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Build Container Image for Security Gate
        run: docker build -t chrono-cloud:ci-${{ github.sha }} .

      - name: Trivy Container Vulnerability Scan (CRITICAL & HIGH)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: chrono-cloud:ci-${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Trivy IaC Misconfiguration Scan (Terraform & Dockerfile)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: terraform
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform Format Check
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Terraform Init & Validate
        run: |
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate
