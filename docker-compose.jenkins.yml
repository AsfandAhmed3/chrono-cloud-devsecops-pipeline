services:
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    container_name: chrono-cloud-jenkins
    user: root
    restart: unless-stopped
    ports:
      - "8090:8080"
      - "50060:50000"
    env_file:
      - .env.jenkins.local
    environment:
      - KUBECONFIG=/var/jenkins_home/.kube/config
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace
      - ${USERPROFILE}/.kube/config:/root/.kube/config-host:ro
      - jenkins_data:/var/jenkins_home
    networks:
      - kind

  smee:
    image: node:20-alpine
    container_name: chrono-cloud-webhook-relay
    restart: unless-stopped
    env_file:
      - .env.jenkins.local
    command:
      - sh
      - -c
      - npx --yes smee-client --url "$${SMEE_URL}" --target http://chrono-cloud-jenkins:8080/github-webhook/
    depends_on:
      - jenkins
    networks:
      - kind

volumes:
  jenkins_data:

networks:
  kind:
    external: true
